# Real Postgres and Redis, for running against the production stack.
#
# The app does NOT need this: with no DATABASE_URL and no REDIS_URL it runs on
# in-process Postgres (PGlite) and a Postgres-backed job poller. Use this when
# you want to exercise real concurrency -- which is also what unskips the tests
# in test/concurrency.test.js.
#
#   docker compose up -d
#   DATABASE_URL=postgres://billing:billing@localhost:5432/billing \
#   REDIS_URL=redis://localhost:6379 npm start

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
